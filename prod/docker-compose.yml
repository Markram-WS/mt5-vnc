# Production MT5 headless - lightweight, shares the dev Wine-prefix volume
services:
  mt5-prod:
    build: .
    container_name: mt5_prod
    restart: unless-stopped

    ports:
      - "8002:8001"          # mt5linux API only (host 8002 -> container 8001; dev uses 8001)

    environment:
      # MT5 credentials for auto-login (reads from prod/.env)
      MT5_SERVER: ${MT5_SERVER:-}
      MT5_ACCOUNT: ${MT5_ACCOUNT:-}
      MT5_PASSWORD: ${MT5_PASSWORD:-}

      # Company / Platform configuration
      COMPANY_ENV: ${COMPANY_ENV:-production}
      COMPANY_REGION: ${COMPANY_REGION:-us-east-1}

      # API - always on for headless
      ENABLE_MT5LINUX_API: ${ENABLE_MT5LINUX_API:-true}

      # Auto-start EA
      MT5_AUTO_START_EA: ${MT5_AUTO_START_EA:-TestAutoStartEA}
      MT5_AUTO_START_SYMBOL: ${MT5_AUTO_START_SYMBOL:-EURUSD}
      MT5_AUTO_START_PERIOD: ${MT5_AUTO_START_PERIOD:-H1}

      # Headless mode is automatic in this image
      HEADLESS: "true"
      WINEPREFIX: /opt/mt5

      # Log retention: delete MT5 log files older than N days (daily). 0 = off.
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
      LOG_RETENTION_INTERVAL: ${LOG_RETENTION_INTERVAL:-86400}

    # Guaranteed MT5 LiveUpdate block (compose injects these into /etc/hosts)
    extra_hosts:
      - "update.mql5.com:127.0.0.1"
      - "updates.mql5.com:127.0.0.1"

    volumes:
      # SHARE the EXACT volume dev uses (login + MT5 install + EA profile state).
      # Same PV that will back this in Kubernetes.
      - mt5-vantage:/opt/mt5/
      # Shared repo MQL5 tree (one tree for both modes).
      # Compose-only: this is the authoring/test tree. Kubernetes pods do NOT
      # read it -- the fetch-mql5 init container clones the pinned tag
      # mql5-v1 (ConfigMap mt5-env MQL5_GIT_REF) into the pod's own emptyDir.
      - ../mql5:/opt/mt5/drive_c/Program Files/MetaTrader 5/MQL5/
      - ./Metatrader/startup.ini:/opt/mt5/drive_c/Program Files/MetaTrader 5/startup.ini
    shm_size: '256m'
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  # Reuse the dev volume by name so login/EA state carries across (K8s will mount
  # the same PV). Compose-prefixed dev volume is mt5-dev_mt5-vantage.
  mt5-vantage:
    external: true
    name: mt5-dev_mt5-vantage