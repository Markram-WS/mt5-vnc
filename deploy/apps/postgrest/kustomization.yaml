# The PostgREST test stack: Postgres (ephemeral) + PostgREST + the `events`
# table they share. Namespace mt5-data, defined here so both overlays can
# include this directory unchanged.
#
# Apply targets:
#   kind-dev   -> resources: ../../apps/postgrest; Secret postgrest-db is
#                 created out-of-band by scripts/secrets.sh (from the repo-root
#                 .env) before the overlay is applied
#   talos-prod -> resources: ../../apps/postgrest + ../../apps/postgrest/talos-prod
#                 (the latter materializes Secret postgrest-db from Vault)
#
# There is deliberately NO secretGenerator anywhere in this directory: it must
# render from committed files alone, and the Talos overlay must never need a
# local secret file. Same Secret name and keys in both environments, so the
# Deployments never change.
#
# WHO connects (POSTGRES_USER / POSTGRES_PASSWORD) is Secret `postgrest-db`.
# WHERE the database is (POSTGRES_HOST / POSTGRES_PORT / POSTGRES_DB /
# POSTGREST_URL) is ConfigMap `postgres-conn` in configmap.yaml — coordinates
# are not credentials and do not belong in a Secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mt5-data

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - postgrest.yaml
