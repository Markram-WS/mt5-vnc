# The PostgREST test stack: Postgres (ephemeral) + PostgREST + the `events`
# table they share. Namespace mt5-data, defined here so both overlays can
# include this directory unchanged.
#
# Apply targets:
#   kind-dev  -> resources: ../../apps/postgrest + secretGenerator postgrest-db
#   talos     -> resources: ../../apps/postgrest + ../../apps/postgrest/talos
#                (the latter materializes Secret postgrest-db from Vault)
#
# There is deliberately NO secretGenerator here: the base must render from
# committed files alone, and the Talos overlay must never need a local secret
# file. Secret `postgrest-db` (key POSTGRES_PASSWORD) is provided by the overlay:
# generated from the gitignored deploy/overlays/kind-dev/postgrest-secrets.env on
# kind, from the ExternalSecret in ./talos on Talos. Same name in both, so the
# Deployments never change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mt5-data

resources:
  - namespace.yaml
  - postgres.yaml
  - postgrest.yaml
