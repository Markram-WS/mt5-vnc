# Secret postgrest-db on the Talos (prod) cluster, materialized from Vault by
# the external-secrets operator (ClusterSecretStore "vault-backend", the fleet
# convention). It is the ONLY difference between the two environments for this
# stack: the Deployments in ../ reference the same Secret name and keys.
#
# Vault KV v2 path: secret/mt5  (API: /v1/secret/data/mt5)
# Properties:       POSTGRES_USER       <-- NEW key, added for this service
#                   POSTGRES_PASSWORD   <-- NEW key, added for this service
#
# BOTH properties must exist BEFORE applying this overlay; until then the
# ExternalSecret reports SecretSyncedError and both pods stay in
# CreateContainerConfigError because Secret postgrest-db does not exist.
# Nothing in this file is a credential — the values only ever live in Vault.
#
#   vault kv patch secret/mt5 POSTGRES_USER=mt5 POSTGRES_PASSWORD="$(openssl rand -hex 32)"
#
# POSTGRES_USER is the role the postgres entrypoint creates AND the role
# PostgREST connects as (PGRST_DB_ANON_ROLE expands the same key), so it must be
# one value everywhere: Vault, this ExternalSecret, and the kind env file.
#
# The password is also part of PGRST_DB_URI
# (postgres://<user>:<pw>@postgres:5432/mt5), so keep it URL-safe: hex/base64url
# only. A `/`, `:` or `@` would have to be percent-encoded inside the URI.
#
# There is no external secret for the kind cluster: the kind-dev overlay
# generates the same Secret from its gitignored postgrest-secrets.env.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgrest-db
  namespace: mt5-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgrest-db
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: secret/mt5
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/mt5
        property: POSTGRES_PASSWORD
