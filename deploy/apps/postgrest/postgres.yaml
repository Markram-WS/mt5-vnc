# Ephemeral Postgres for the PostgREST test service.
#
# No PVC on purpose: PGDATA lives on an emptyDir, so every pod restart starts
# from an empty cluster and `/docker-entrypoint-initdb.d/init.sql` re-creates
# the schema. The test EA is expected to leave zero rows behind, and even a
# leaked row cannot survive a restart.
#
# The user and password come from Secret `postgrest-db` (same name in both
# environments): generated from a gitignored env file in the kind overlay,
# materialized from Vault by the ExternalSecret on Talos. `init.sql` runs as
# POSTGRES_USER, so that role owns the schema, the table and the sequence — the
# script grants nothing explicitly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: postgrest-test
data:
  # Runs only when the entrypoint finds an empty PGDATA, but written to be
  # idempotent so it can also be re-applied by hand with psql.
  init.sql: |
    CREATE TABLE IF NOT EXISTS public.events (
        id         bigserial PRIMARY KEY,
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz,
        source     text   NOT NULL,
        action     text   NOT NULL,
        payload    jsonb
    );

    CREATE OR REPLACE FUNCTION public.events_set_updated_at()
    RETURNS trigger
    LANGUAGE plpgsql
    AS $$
    BEGIN
        NEW.updated_at := now();
        RETURN NEW;
    END;
    $$;

    DROP TRIGGER IF EXISTS events_set_updated_at ON public.events;
    CREATE TRIGGER events_set_updated_at
        BEFORE UPDATE ON public.events
        FOR EACH ROW
        EXECUTE FUNCTION public.events_set_updated_at();

    -- No GRANTs: the entrypoint runs this script as POSTGRES_USER, so that
    -- role already owns the schema, the table and the sequence.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: postgrest-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: postgrest-test
    spec:
      containers:
        - name: postgres
          # 16-alpine pinned by digest (multi-arch index: amd64 + arm64) so the
          # tiny test fixture cannot drift between kind and Talos.
          image: docker.io/library/postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: mt5
            # The role is a Secret value, not a literal: Vault (and the kind env
            # file generated by kind-up.sh) is the single source of truth for
            # both the user and the password. Note PGRST_DB_ANON_ROLE in
            # postgrest.yaml uses the same key, so one edit moves both.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgrest-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgrest-db
                  key: POSTGRES_PASSWORD
            # Keep the cluster inside the emptyDir subdirectory: the entrypoint
            # then owns a directory it can create itself, and the volume root
            # keeps the lost+found semantics of a mounted filesystem.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            # Shell form on purpose: exec probes do not expand $(VAR), and the
            # role now comes from the Secret. postgres:16-alpine ships sh.
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d mt5
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: postgrest-test
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
