apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mt5

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# No secretGenerator here on purpose: the base must render from the committed
# files alone, so it can parent overlays that get their credentials elsewhere
# (ExternalSecret on the Talos cluster). Each kind overlay generates
# mt5-secrets from its own secrets.env, written there by scripts/kind-up.sh from
# dev/.env (never committed, mode 0600).
