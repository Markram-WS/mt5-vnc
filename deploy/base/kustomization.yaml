apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mt5

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# No secretGenerator here (or in any overlay) on purpose: every root renders
# from the committed files alone, so the credentials always come from elsewhere
# — scripts/secrets.sh on kind, ExternalSecret from Vault on Talos. Secret
# `mt5-secrets` is referenced `optional: true`, so a cluster with no such Secret
# (prod) still runs.
