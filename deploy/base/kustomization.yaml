apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mt5

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# deploy/base/secrets.env is generated by scripts/kind-up.sh from the selected
# mode's .env (never committed, mode 0600) and is required at render time.
secretGenerator:
  - name: mt5-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true
