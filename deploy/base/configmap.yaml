# Non-secret runtime configuration for the mt5 pod.
#
# HEADLESS is the single runtime switch the dev image's entrypoint reads
# (/Metatrader/entrypoint.sh: HEADLESS=true -> headless.sh, else -> /init).
# The prod image ignores it (its entrypoint is always headless.sh) but the
# talos overlay still sets it to true so `kubectl describe` tells the truth.
#
# Every key is supplied here; start.sh supplies its own defaults only as a
# fallback. The EA auto-start keys mirror what dev/.env and prod/.env use, so
# the EA config is identical no matter which environment is applied.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mt5-env
  labels:
    app.kubernetes.io/name: mt5
    app.kubernetes.io/part-of: mt5
data:
  # MQL5 tree for the pod. The images ship no MQL5; the fetch-mql5 init
  # container clones this repo at this ref and copies mql5/ into the pod's
  # emptyDir (the settrade pattern, with mql5/ as the payload). A branch ref
  # means "latest push wins"; use a tag when a rollout must reproduce exactly
  # one tree (git clone --branch accepts branches and tags, not raw SHAs).
  MQL5_GIT_URL: "https://github.com/Markram-WS/mt5-vnc.git"
  MQL5_GIT_REF: "mql5-v1"
  # Login-profile source for the fetch-profile init container (the talos prod
  # overlay only; dev mounts the host profile instead). MT5 logs in from this
  # profile alone; there are no MT5 credentials anywhere. The talos overlay
  # patches MINIO_URL to the in-cluster Service.
  MINIO_URL: "http://minio.tailb297d3.ts.net:9000"
  MINIO_BUCKET: "mt5"
  MINIO_PROFILE_PREFIX: "prod-demo"
  VNC_RESOLUTION: "1280x800"
  COMPANY_ENV: "production"
  COMPANY_REGION: "us-east-1"
  MT5_BROKER_SERVER: ""
  MT5_BROKER_PORT: "443"
  ENABLE_MT5LINUX_API: "true"
  MT5_AUTO_START_EA: "TestAutoStartEA"
  MT5_AUTO_START_SYMBOL: "EURUSD"
  MT5_AUTO_START_PERIOD: "H1"
  LOG_RETENTION_DAYS: "7"
  LOG_RETENTION_INTERVAL: "86400"
  HEADLESS: "false"
  WINEPREFIX: "/opt/mt5"
  LSIO_NON_ROOT_USER: "true"
