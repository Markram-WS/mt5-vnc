apiVersion: v1
kind: Service
metadata:
  name: mt5
  labels:
    app.kubernetes.io/name: mt5
    app.kubernetes.io/part-of: mt5
spec:
  # ClusterIP by default; both kind overlays switch this to NodePort and pin
  # 30300 (VNC) / 30801 (mt5linux). Prod keeps the same NodePorts but nothing
  # ever listens on 3000 there.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mt5
  ports:
    - name: vnc
      port: 3000
      targetPort: vnc
      protocol: TCP
    - name: mt5linux
      port: 8001
      targetPort: mt5linux
      protocol: TCP
