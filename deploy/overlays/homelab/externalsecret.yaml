# mt5-secrets on the homelab cluster, materialized from Vault by the
# external-secrets operator (ClusterSecretStore "vault-backend", the fleet
# convention).
#
# Vault path: secret/mt5/prod
# Keys:       CUSTOM_USER, PASSWORD, MT5_SERVER, MT5_ACCOUNT, MT5_PASSWORD
#
# The Vault path must be written BEFORE this manifest is applied: until then the
# ExternalSecret reports SecretSyncedError and the pod stays in
# CreateContainerConfigError because Secret mt5-secrets does not exist. Nothing
# in this file is a credential — the values only ever live in Vault.
#
#   vault kv put secret/mt5/prod \
#     CUSTOM_USER=... PASSWORD=... MT5_SERVER=... MT5_ACCOUNT=... MT5_PASSWORD=...
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mt5-secrets
  namespace: mt5
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mt5-secrets
  data:
    - secretKey: CUSTOM_USER
      remoteRef:
        key: secret/mt5/prod
        property: CUSTOM_USER
    - secretKey: PASSWORD
      remoteRef:
        key: secret/mt5/prod
        property: PASSWORD
    - secretKey: MT5_SERVER
      remoteRef:
        key: secret/mt5/prod
        property: MT5_SERVER
    - secretKey: MT5_ACCOUNT
      remoteRef:
        key: secret/mt5/prod
        property: MT5_ACCOUNT
    - secretKey: MT5_PASSWORD
      remoteRef:
        key: secret/mt5/prod
        property: MT5_PASSWORD
