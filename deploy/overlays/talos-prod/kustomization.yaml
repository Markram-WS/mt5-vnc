apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROD: the Talos cluster (single node, real Docker Hub image). This is the only
# prod deployment — the local kind cluster is dev-only (deploy/overlays/kind-dev).
# NOT applied yet: see deploy/README.md, "Talos (prod) overlay".
#
# NOTE: no overlay-level `namespace:` — each included root declares its own
# (base -> mt5, apps/postgrest -> mt5-data). A parent namespace would override
# both, so the only resources needing it here are the PVC in storage.yaml and
# the secrets, which already declare it.
resources:
  - ../../base
  - storage.yaml
  - externalsecret.yaml
  # PostgREST test stack + its Vault-backed Secret postgrest-db (namespace
  # mt5-data). Add POSTGRES_PASSWORD to secret/mt5 first — see
  # apps/postgrest/talos-prod/externalsecret.yaml.
  - ../../apps/postgrest
  - ../../apps/postgrest/talos-prod

# The prod deltas (HEADLESS=true, tini entrypoint, lean resources) come from the
# shared prod-headless component, plus the fetch-profile init container that
# seeds the login profile from MinIO. No kind-nodeports component: Talos has no
# kind port mappings, and this overlay publishes only the API.
components:
  - ../../components/prod-headless
  - ../../components/fetch-profile

images:
  - name: mt5
    newName: markram92/mt5-prod
    newTag: 1.0.0

patches:
  # MinIO runs in-cluster on Talos: use the Service DNS name instead of the
  # tailnet endpoint in the base ConfigMap (same bucket/prefix).
  - target:
      kind: ConfigMap
      name: mt5-env
    patch: |-
      - op: replace
        path: /data/MINIO_URL
        value: http://minio.minio.svc.cluster.local:9000

  # The Service keeps ONLY the mt5linux API: prod is headless, so there is no
  # VNC port to publish. 30801 is the API port the client side already uses.
  - target:
      kind: Service
      name: mt5
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: replace
        path: /spec/ports
        value:
          - name: mt5linux
            port: 8001
            targetPort: mt5linux
            protocol: TCP
            nodePort: 30801

  # Pin the pull policy explicitly: the tag is a release tag, so the node only
  # pulls when the image is absent (a re-tagged build needs a pod restart).
  - target:
      kind: Deployment
      name: mt5
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
