# mt5-minio on the Talos (prod) cluster, materialized from Vault by the
# external-secrets operator (ClusterSecretStore "vault-backend", the fleet
# convention). It is consumed ONLY by the fetch-profile init container, which
# seeds the MT5 login profile from MinIO on the first start of an empty prefix.
#
# Vault KV v2 path: secret/mt5  (API: /v1/secret/data/mt5)
# Properties: MINIO_ACCESS_KEY and MINIO_SECRET_KEY, materialized under the
#             same names (MINIO_ACCESS_KEY / MINIO_SECRET_KEY) in the Secret.
#
# The Vault path must be written BEFORE this manifest is applied: until then the
# ExternalSecret reports SecretSyncedError and the pod stays in
# CreateContainerConfigError because Secret mt5-minio does not exist. Nothing in
# this file is a credential — the values only ever live in Vault.
#
#   vault kv put secret/mt5 MINIO_ACCESS_KEY=... MINIO_SECRET_KEY=...
#
# There is deliberately NO MT5 credential Secret any more: login comes from the
# profile in MinIO (bucket mt5, prefix prod-demo), not from /login arguments.
# The base Deployment's `mt5-secrets` ref is optional, so headless prod runs
# without it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mt5-minio
  namespace: mt5
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mt5-minio
  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: secret/mt5
        property: MINIO_ACCESS_KEY
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: secret/mt5
        property: MINIO_SECRET_KEY
