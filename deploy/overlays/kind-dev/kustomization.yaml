apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev mode: gmag11/metatrader5_vnc base image, KasmVNC UI on 3000,
# mt5linux API on 8001, HEADLESS=false (from the base ConfigMap).
namespace: mt5

resources:
  - ../../base
  - storage.yaml

# kind host ports (30300 -> 3000, 30801 -> 8001), shared with kind-prod.
components:
  - ../../components/kind-nodeports

images:
  - name: mt5
    newName: localhost/mt5-dev
    newTag: dev
