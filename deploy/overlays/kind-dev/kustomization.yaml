apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev: gmag11/metatrader5_vnc base image, KasmVNC UI on 3000,
# mt5linux API on 8001, HEADLESS=false (from the base ConfigMap).
#
# NOTE: there is no overlay-level `namespace:` here any more. Each included
# kustomization root declares its own namespace (base -> mt5, apps/postgrest ->
# mt5-data), and a parent `namespace:` would override ALL of them — including
# renaming a child's Namespace object. Composing independent namespaces is the
# whole point of this overlay now that it also deploys the PostgREST test stack.
# The only resources that therefore need an explicit namespace are the ones
# generated *here* (the secrets below) and the PVC in storage.yaml.
resources:
  - ../../base
  - storage.yaml
  - ../../apps/postgrest

# kind host ports (30300 -> 3000, 30801 -> 8001) for the dev cluster.
components:
  - ../../components/kind-nodeports

# The MT5 login profile in dev is the HOST directory, mounted read-write over
# the terminal's Config dir: log in once via VNC and the file MT5 writes is the
# one you later copy to MinIO for prod to seed from. No MT5_* credentials are
# involved in dev. The host dir is created (and seeded once from the prefix) by
# scripts/kind-up.sh. No fetch-profile component here on purpose.
patches:
  - path: profile-volume.yaml
    target:
      kind: Deployment
      name: mt5
  # Generated secrets carry no namespace of their own (kustomize's
  # secretGenerator has no namespace option), so pin them here: mt5-secrets is
  # read by the MT5 pod, postgrest-db by the Postgres/PostgREST pods.
  - target:
      kind: Secret
      name: mt5-secrets
    patch: |-
      - op: add
        path: /metadata/namespace
        value: mt5
  - target:
      kind: Secret
      name: postgrest-db
    patch: |-
      - op: add
        path: /metadata/namespace
        value: mt5-data

# Credentials for this cluster. secrets.env sits next to this file (kustomize
# refuses env files outside the kustomization root) and is generated by
# scripts/kind-up.sh from dev/.env: never committed, mode 0600. The base carries
# no secretGenerator, so it renders without any local secret file.
secretGenerator:
  - name: mt5-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true
  # PostgREST test database password. Same Secret name/key the Talos overlay
  # gets from Vault (apps/postgrest/talos/externalsecret.yaml), so the Postgres
  # and PostgREST Deployments are identical in both environments. Written by
  # scripts/kind-up.sh with a random value; template in
  # apps/postgrest/secrets.env.example.
  - name: postgrest-db
    envs:
      - postgrest-secrets.env
    options:
      disableNameSuffixHash: true

images:
  - name: mt5
    newName: localhost/mt5-dev
    newTag: dev
