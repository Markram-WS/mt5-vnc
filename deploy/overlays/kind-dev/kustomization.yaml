apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev: gmag11/metatrader5_vnc base image, KasmVNC UI on 3000,
# mt5linux API on 8001, HEADLESS=false (from the base ConfigMap).
#
# NOTE: there is no overlay-level `namespace:` here any more. Each included
# kustomization root declares its own namespace (base -> mt5, apps/postgrest ->
# mt5-data), and a parent `namespace:` would override ALL of them — including
# renaming a child's Namespace object. Composing independent namespaces is the
# whole point of this overlay now that it also deploys the PostgREST test stack.
# The only resource that therefore needs an explicit namespace is the PVC in
# storage.yaml.
resources:
  - ../../base
  - storage.yaml
  - ../../apps/postgrest

# kind host ports (30300 -> 3000, 30801 -> 8001) for the dev cluster.
components:
  - ../../components/kind-nodeports

# The MT5 login profile in dev is the HOST directory, mounted read-write over
# the terminal's Config dir: log in once via VNC and the file MT5 writes is the
# one you later copy to MinIO for prod to seed from. No MT5_* credentials are
# involved in dev. The host dir is created (and seeded once from the prefix) by
# scripts/kind-up.sh. No fetch-profile component here on purpose.
patches:
  - path: profile-volume.yaml
    target:
      kind: Deployment
      name: mt5

# Secrets are applied out-of-band by scripts/secrets.sh (from the repo-root
# .env) BEFORE `kubectl apply -k` on this overlay, so this overlay renders from
# committed files alone — `kubectl kustomize` works on a clean checkout, and no
# secret material can appear in a render or a diff:
#
#   scripts/secrets.sh apply
#   kubectl apply -k deploy/overlays/kind-dev
#
# The same Secret names are created by the Talos overlay from Vault
# (ExternalSecret), so neither the Deployments nor their references differ
# between environments.

images:
  - name: mt5
    newName: localhost/mt5-dev
    newTag: dev
