apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev mode: gmag11/metatrader5_vnc base image, KasmVNC UI on 3000,
# mt5linux API on 8001, HEADLESS=false (from the base ConfigMap).
namespace: mt5

resources:
  - ../../base
  - storage.yaml

# kind host ports (30300 -> 3000, 30801 -> 8001), shared with kind-prod.
components:
  - ../../components/kind-nodeports

# The MT5 login profile in dev is the HOST directory, mounted read-write over
# the terminal's Config dir: log in once via VNC and the file MT5 writes is the
# one you later copy to MinIO for prod to seed from. No MT5_* credentials are
# involved in dev. The host dir is created (and seeded once from the prefix) by
# scripts/kind-up.sh. No fetch-profile component here on purpose.
patches:
  - path: profile-volume.yaml
    target:
      kind: Deployment
      name: mt5

# Credentials for this cluster. secrets.env sits next to this file (kustomize
# refuses env files outside the kustomization root) and is generated by
# scripts/kind-up.sh from dev/.env: never committed, mode 0600. The base carries
# no secretGenerator, so it renders without any local secret file.
secretGenerator:
  - name: mt5-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true

images:
  - name: mt5
    newName: localhost/mt5-dev
    newTag: dev
