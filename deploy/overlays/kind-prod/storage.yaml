# Node-local storage for the shared Wine prefix — identical to kind-dev's PV/PVC
# (same name, same path, same 20Gi, Retain). Both overlays ship it so either one
# can be applied to a fresh cluster; applying the other mode is then an in-place
# update of the same objects, and the prefix (install + login state) carries
# over from dev to prod, which is the whole point of the shared PV.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mt5-prefix-pv
  labels:
    app.kubernetes.io/name: mt5
    app.kubernetes.io/part-of: mt5
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/mt5/prefix
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mt5-prefix
  labels:
    app.kubernetes.io/name: mt5
    app.kubernetes.io/part-of: mt5
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
  volumeName: mt5-prefix-pv
