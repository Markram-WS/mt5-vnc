apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# prod mode: tobix/wine:stable base image, headless (Xvfb :99, no VNC),
# mt5linux API on 8001, HEADLESS=true, leaner resources.
namespace: mt5

resources:
  - ../../base
  - storage.yaml

# The prod deltas (HEADLESS=true, tini entrypoint, lean resources) live in one
# shared component; kind-prod and the homelab overlay both opt into it.
# kind host ports (30300 -> 3000, 30801 -> 8001), shared with kind-dev.
components:
  - ../../components/prod-headless
  - ../../components/kind-nodeports

# Credentials for this cluster. secrets.env sits next to this file (kustomize
# refuses env files outside the kustomization root) and is generated by
# scripts/kind-up.sh from prod/.env: never committed, mode 0600. The base
# carries no secretGenerator, so it renders without any local secret file.
secretGenerator:
  - name: mt5-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true

images:
  - name: mt5
    newName: localhost/mt5-prod
    newTag: prod
