# registries.conf for the mt5 kind deployment.
#
# This host has no /etc/containers/registries.conf (podman on Arch ships it in
# "containers-common", which is not installed), so podman/buildah cannot resolve
# unqualified image names at all:
#
#   Error: short-name "gmag11/metatrader5_vnc:latest" did not resolve to an
#   alias and no containers-registries.conf(5) was found
#
# Both Dockerfiles use short base-image names (dev: gmag11/metatrader5_vnc,
# prod: tobix/wine) and kind asks podman for "kindest/node", so the scripts
# point CONTAINERS_REGISTRIES_CONF at this file. Explicit aliases are used
# instead of search-registry guessing: every short name maps to exactly one
# docker.io reference.
unqualified-search-registries = ["docker.io"]

short-name-mode = "enforcing"

[aliases]
"gmag11/metatrader5_vnc" = "docker.io/gmag11/metatrader5_vnc"
"tobix/wine" = "docker.io/tobix/wine"
"kindest/node" = "docker.io/kindest/node"
"alpine" = "docker.io/library/alpine"
"busybox" = "docker.io/library/busybox"
